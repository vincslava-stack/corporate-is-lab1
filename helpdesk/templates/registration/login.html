
{% extends "helpdesk/base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<h1>Вход в систему</h1>

{% if form.errors %}
<p>Неверное имя пользователя или пароль.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Войти</button>
</form>
{% endblock %}
